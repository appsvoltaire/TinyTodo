[package]
name = "tinytodo"
version = "0.2.0"
edition = "2024"
description = "Tiny desktop popup for a personal assistant that lives in a private Slack channel"
repository = "https://github.com/appsvoltaire/TinyTodo"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
futures = "0.3"
iced = { version = "0.14", features = ["tokio"] }
keyring = "4.2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
window-vibrancy = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
